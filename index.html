<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>K's App</title>
    <meta
      name="description"
      content="K's App is a common support website for apps published by K's App."
    >
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/script.js" defer></script>
  </head>
  <body data-language="en">
    <div class="site-shell">
      <header class="site-header" aria-label="Site header">
        <a class="brand" href="index.html">K's App</a>
        <div class="header-actions">
          <nav class="nav" aria-label="Main navigation">
            <a aria-current="page" href="index.html">
              <span data-lang="en">Home</span>
              <span data-lang="jp">ホーム</span>
            </a>
            <a href="apps.html">
              <span data-lang="en">Apps</span>
              <span data-lang="jp">アプリ</span>
            </a>
            <a href="support.html">
              <span data-lang="en">Support</span>
              <span data-lang="jp">サポート</span>
            </a>
          </nav>
          <div class="language-switch" aria-label="Language">
            <button type="button" data-language-option="en" aria-pressed="true">EN</button>
            <button type="button" data-language-option="jp" aria-pressed="false">JP</button>
          </div>
        </div>
      </header>

      <main>
        <section class="hero" aria-labelledby="home-title">
          <p class="section-label">Independent app development</p>
          <h1 id="home-title">K's App</h1>
          <div class="language-copy">
            <p class="hero-text" data-lang="en">
              A common support website for apps developed and published by
              K's App.
            </p>
            <p class="hero-text" data-lang="jp">
              K's Appが開発・公開するアプリのための共通サポートサイトです。
            </p>
          </div>
          <div class="action-row" aria-label="Primary links">
            <a class="button button-primary" href="apps.html">
              <span data-lang="en">View Apps</span>
              <span data-lang="jp">アプリを見る</span>
            </a>
            <a class="button button-secondary" href="support.html">
              <span data-lang="en">Get Support</span>
              <span data-lang="jp">サポートを見る</span>
            </a>
          </div>
        </section>

      </main>

      <footer class="site-footer">
        <p>&copy; 2026 K's App. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
